[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "real-time-visual-classificator"
version = "0.1.0"
description = "Local webcam object classification using vision model token probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Real-time Visual Classificator contributors"}]
dependencies = []

[project.optional-dependencies]
webcam = ["opencv-python==5.0.0.93"]

[project.scripts]
visual-classifier = "visual_classifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_classifier"]
