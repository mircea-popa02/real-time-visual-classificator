[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jev-vision-probe"
version = "0.1.0"
description = "Configurable Jev-style decisions for local vision models and the Jev API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jev Vision Probe contributors"}]
dependencies = []

[project.optional-dependencies]
webcam = ["opencv-python==5.0.0.93"]

[project.scripts]
jev-vision = "jev_vision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_vision"]
